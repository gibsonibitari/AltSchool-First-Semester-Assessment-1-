<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Star Rating Component</title>
</head>
<body>

  <!-- Component Template -->
  <template id="star-rating-template">
    <style>
      :host {
        display: inline-block;
      }

      .rating {
        display: flex;
        flex-direction: row-reverse;
        justify-content: flex-end;
        gap: 4px;
      }

      /* Hide native radio buttons visually */
      .rating input {
        display: none;
      }

      /* Render star labels */
      .rating label {
        font-size: 2rem;
        color: #ccc;
        cursor: pointer;
        transition: color 0.2s ease-in-out;
      }

      /* Highlight checked star and all preceding stars */
      .rating input:checked ~ label,
      .rating label:hover,
      .rating label:hover ~ label {
        color: #ffc107;
      }
    </style>

    <div class="rating">
      <input type="radio" id="star5" name="rating" value="5">
      <label for="star5" title="5 stars">★</label>

      <input type="radio" id="star4" name="rating" value="4">
      <label for="star4" title="4 stars">★</label>

      <input type="radio" id="star3" name="rating" value="3">
      <label for="star3" title="3 stars">★</label>

      <input type="radio" id="star2" name="rating" value="2">
      <label for="star2" title="2 stars">★</label>

      <input type="radio" id="star1" name="rating" value="1">
      <label for="star1" title="1 star">★</label>
    </div>
  </template>

  <!-- Usage -->
  <h3>Select Your Rating:</h3>
  <star-rating></star-rating>

  <!-- Definition Script -->
  <script>
    customElements.define('star-rating', class extends HTMLElement {
      constructor() {
        super();
        const template = document.getElementById('star-rating-template');
        if (template) {
          const shadowRoot = this.attachShadow({ mode: 'open' });
          shadowRoot.appendChild(template.content.cloneNode(true));
        }
      }

      // Helper getter to read selected value via JavaScript
      get value() {
        const checked = this.shadowRoot.querySelector('input:checked');
        return checked ? checked.value : null;
      }
    });
  </script>

</body>
</html>

<!--1. register new tag: customElements.define('star-rating', ...) tells the browser, "Hey, whenever you see <star-rating>, run this setup script."

2. inherit html abilities: class extends HTMLElement gives your new component all the built-in powers of standard HTML tags (like clickable events, layout properties, and styling capabilities).

3. initialize base code: super() boots up the standard HTML engine before running custom logic.

4. grab blueprint: document.getElementById('star-rating-template').content finds the hidden <template> on your page containing the star design.

5. create protective shield: this.attachShadow({ mode: 'open' }) creates a isolated sandbox (Shadow DOM) so external page CSS won't mess up your stars, and your star styles won't break the page.

stamp out copy: shadowRoot.appendChild(starRating.cloneNode(true)) makes a fresh copy of the star design and drops it inside that shielded box.-->
