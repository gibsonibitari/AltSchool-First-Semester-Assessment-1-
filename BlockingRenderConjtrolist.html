<section class="api-demo-section">
  <style>
    .api-demo-section {
      font-family: Arial, sans-serif;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      max-width: 600px;
    }

    /* Style for the CSS Custom Highlight API */
    ::highlight(text-search-match) {
      background-color: #ffeb3b;
      color: #000;
      font-weight: bold;
    }
  </style>

  <h3>Web APIs & Attributes Demo</h3>

  <!-- Video with controlslist -->
  <div>
    <h4>1. Media Player (No Download Button)</h4>
    <video src="https://www.w3schools.com/html/mov_bbb.mp4" controls controlslist="nodownload" width="100%"></video>
  </div>

  <!-- CSS Custom Highlight Target -->
  <div>
    <h4>2. CSS Custom Highlight API Output</h4>
    <p id="highlight-target">Full-stack web applications leverage modern browser APIs for secure, performant execution.</p>
    <button id="trigger-highlight">Highlight "web applications"</button>
  </div>

  <script>
    document.getElementById('trigger-highlight').addEventListener('click', () => {
      const target = document.getElementById('highlight-target');
      if (!CSS.highlights) {
        alert('CSS Custom Highlight API is not supported in this browser.');
        return;
      }

      const range = new Range();
      // Target character offset range inside text node
      range.setStart(target.firstChild, 11);
      range.setEnd(target.firstChild, 27);

      const customHighlight = new Highlight(range);
      CSS.highlights.set('text-search-match', customHighlight);
    });
  </script>
</section>
