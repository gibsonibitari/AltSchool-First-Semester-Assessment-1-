<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Card Component</title>
</head>
<body>

  <!-- Web Component Template -->
  <template id="card-template">
    <style>
      :host {
        display: block;
        margin-bottom: 20px;
      }
      .card {
        border: 1px solid #ccc;
        padding: 10px;
        background-color: #f5f5f5;
      }
      ::slotted(h2) {
        margin-top: 0;
      }
      ::slotted(p) {
        color: #666;
      }
    </style>
    <div class="card">
      <slot name="card-header"></slot>
      <slot name="card-content"></slot>
    </div>
  </template>

  <!-- Component Usage -->
  <custom-card>
    <h2 slot="card-header">Card Title</h2>
    <p slot="card-content">This is the content of the card.</p>
  </custom-card>

  <!-- Component Definition Script -->
  <script>
    class CustomCard extends HTMLElement {
      constructor() {
        super();
        let template = document.getElementById('card-template');
        let content = template.content.cloneNode(true); // Fixed: cloning template.content
        let shadowRoot = this.attachShadow({ mode: 'open' });
        shadowRoot.appendChild(content);
      }
    }

    // Define the custom element
    customElements.define('custom-card', CustomCard);
  </script>

</body>
</html>
